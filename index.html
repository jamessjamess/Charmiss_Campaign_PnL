<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Campaign P&amp;L</title>
<!-- Double-click this file to open the demo (file://, no server, no Node) · keep every file in its folder as it is.
     CR-06 (D51): demo data only — made up in the browser from data/mock-scenario.js · what people click stays in their own browser (localStorage) until
     Reset demo data (the Acting as menu). The way of the real P&L files (build_seed.py · seed.js · the file writes) is kept in archive/v0.5-real/. -->
<link rel="stylesheet" href="src/styles.css">
<!-- CR-12 §4.1 — the language and the theme before the page draws (no white flash) -->
<script src="src/boot.js"></script>
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidenav" id="sidenav">
    <div class="sn-top">
      <div class="sn-brand" id="brand"></div>
      <button type="button" class="icon-btn sn-collapse" id="navCollapse"></button>
    </div>
    <label class="sn-search" id="navSearchBox"><span id="navSearchIcon"></span><input type="search" id="navSearch" autocomplete="off" spellcheck="false"></label>
    <nav class="sn-nav" id="nav"></nav>
    <div class="sn-bottom" id="navBottom"></div>
  </aside>
  <div class="sn-overlay hidden" id="navOverlay"></div>
  <div class="app-main">
    <header class="topbar">
      <button type="button" class="icon-btn tb-menu" id="navOpen"></button>
      <button type="button" class="tb-search" id="jumpBtn"></button>
      <span class="devb" id="topDev"></span>
      <span class="spacer"></span>
      <button type="button" class="actorbtn" id="actorBtn" aria-haspopup="menu" aria-expanded="false"></button>
      <!-- CR-12 §2 · §3 — ไทย │ EN · Light │ Dark │ System (a phone: one Display button → a popover) -->
      <div class="seg tbseg" id="langSeg" role="radiogroup"></div>
      <div class="seg tbseg tb-theme" id="themeSeg" role="radiogroup"></div>
      <button type="button" class="icon-btn tb-disp" id="dispBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="dispPop"></button>
      <div class="disppop hidden" id="dispPop" role="dialog"></div>
    </header>
    <main>
      <section id="tab-dashboard" class="hidden"></section>
      <section id="tab-tracking" class="hidden"></section>
      <section id="tab-planning" class="hidden"></section>
      <section id="tab-products" class="hidden"></section>
    </main>
  </div>
</div>
<div class="drawer-wrap hidden" id="drawer"><div class="drawer-overlay" data-dr-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="k_f_h" tabindex="-1" id="drawer_content"></aside></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg" class="dlg"></dialog>
<dialog id="cmdk" class="cmdk" aria-label="Search or jump to"></dialog>
<script src="data/mock-scenario.js"></script>
<script src="src/content.js"></script>
<script src="src/content.th.js"></script>
<script src="src/i18n.js"></script>
<script src="src/icons.js"></script>
<script src="src/rules-pnl.js"></script>
<script src="src/rules-list.js"></script>
<script src="src/rules-plan.js"></script>
<script src="src/mock.js"></script>
<script src="src/ui.js"></script>
<script src="src/ui-range.js"></script>
<script src="src/ui-grid.js"></script>
<script src="src/xlsx.js"></script>
<script src="src/export.js"></script>
<script src="src/actor.js"></script>
<script src="src/screen-dashboard.js"></script>
<script src="src/screen-overview.js"></script>
<script src="src/screen-pnl.js"></script>
<script src="src/screen-sales.js"></script>
<script src="src/screen-expenses-tab.js"></script>
<script src="src/screen-tracking.js"></script>
<script src="src/screen-planning.js"></script>
<script src="src/screen-timeline.js"></script>
<script src="src/screen-plan.js"></script>
<script src="src/screen-products.js"></script>
<script src="src/app.js"></script>
</body>
</html>
